name: CI

# Déclenché sur main ET master (la branche de travail réelle est `master` —
# l'ancien trigger `[main]` seul ne se serait jamais exécuté). Cf. AUDIT C6.
# NB : nécessite un remote git configuré (repo privé, D-010) pour tourner.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-lint-and-test:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Libs système runtime WeasyPrint (rendu PDF) — sinon les tests
      # plan_export / ifc PDF échouent à l'import. Cf. AUDIT C6.
      - name: Install WeasyPrint system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libffi-dev shared-mime-info

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # Les 24 tests d'invariants DB se skippent proprement sans postgres_local
      # (docstring test_ingestion_bdnb.py). La logique pure (scoring, carbone,
      # ML, auth, agents, ifc) tourne.
      - name: Pytest
        run: pytest -v --cov=app --cov-report=term-missing

  frontend-typecheck-build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker-compose-build:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env from .env.example
        run: |
          cp .env.example .env
          # Inject fake values to satisfy required vars during build/config
          sed -i 's|POSTGRES_LOCAL_PASSWORD=changeme_local_only|POSTGRES_LOCAL_PASSWORD=ci_dummy_password|' .env

      - name: Validate docker-compose config
        run: docker compose config

      - name: Build images (no run)
        run: docker compose build
