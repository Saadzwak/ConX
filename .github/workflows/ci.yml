name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest -v --cov=app --cov-report=term-missing

  docker-compose-build:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env from .env.example
        run: |
          cp .env.example .env
          # Inject fake values to satisfy required vars during build/config
          sed -i 's|POSTGRES_LOCAL_PASSWORD=changeme_local_only|POSTGRES_LOCAL_PASSWORD=ci_dummy_password|' .env

      - name: Validate docker-compose config
        run: docker compose config

      - name: Build images (no run)
        run: docker compose build
