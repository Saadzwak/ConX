# ConX — orchestration locale.
# Démarre la stack complète en local : postgres_local (PostGIS), backend FastAPI, martin (tuiles MVT).
# Frontend lancé séparément en dev (npm run dev) ; intégré en J14+.

services:
  postgres_local:
    image: postgis/postgis:16-3.4
    container_name: conx_postgres
    restart: unless-stopped
    # Tuning pour 30 Go de données PostGIS (défauts Docker : shared_buffers=128MB,
    # work_mem=4MB → tris sur disque + risque "could not resize shared memory"
    # sur les parallel scans). Cf. AUDIT. Ajuster à la RAM de la machine hôte
    # (prend effet au prochain `docker compose up` — recréation du conteneur).
    shm_size: 1g
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "effective_cache_size=4GB"
    environment:
      POSTGRES_DB: ${POSTGRES_LOCAL_DB:-conx}
      POSTGRES_USER: ${POSTGRES_LOCAL_USER:-conx}
      POSTGRES_PASSWORD: ${POSTGRES_LOCAL_PASSWORD:?POSTGRES_LOCAL_PASSWORD non défini dans .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Port hôte 5433 par défaut pour éviter conflit avec un PostgreSQL natif éventuel.
      # Le backend accède via le réseau Docker au port interne 5432.
      - "${POSTGRES_LOCAL_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./scripts/sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_LOCAL_USER:-conx} -d ${POSTGRES_LOCAL_DB:-conx}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - conx_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conx_backend
    restart: unless-stopped
    # Hot-reload DEV uniquement (l'image prod n'a plus --reload dans son CMD —
    # cf. backend/Dockerfile / AUDIT M13). Le bind mount ./backend:/app ci-dessous
    # rend le reload effectif.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      # Override pour pointer vers le service postgres_local du réseau Docker
      POSTGRES_LOCAL_HOST: postgres_local
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data:ro              # data/fdes_static.json + sous-dossiers (storage est mounté rw plus bas)
      - ./data/storage:/app/data/storage
      - ./config:/app/config:ro
      - ./skills:/app/skills:ro          # J13 — backend/app/ifc/validator.py importe skills/ifc-check/ifc_validator.py
      - ./agents:/app/agents:ro          # J12+ — agents_client.py lit agents/agents.lock.yaml (created by sync.py)
      - ./docs:/app/docs:ro              # J15 — endpoint /api/agents/plan/cached lit docs/demo_assets/cached_plans/ (committé)
    depends_on:
      postgres_local:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - conx_net

  martin:
    # Sidecar Rust qui sert les tuiles vectorielles MVT depuis postgres_local.
    # J7 activé : auto-publication restreinte au schéma `tiles` (migrations 011/012).
    # Config dans martin.yaml monté en /config.yaml.
    image: ghcr.io/maplibre/martin:latest
    container_name: conx_martin
    restart: unless-stopped
    command:
      - "--config=/config.yaml"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_LOCAL_USER:-conx}:${POSTGRES_LOCAL_PASSWORD}@postgres_local:5432/${POSTGRES_LOCAL_DB:-conx}
    volumes:
      - ./martin.yaml:/config.yaml:ro
    ports:
      # Port hôte 3010 par défaut pour éviter conflit avec d'autres projets Node
      # (ex. Next.js sur 3000). Le frontend Vite proxie /tiles → localhost:${MARTIN_PORT_HOST:-3010}.
      - "${MARTIN_PORT_HOST:-3010}:3000"
    depends_on:
      postgres_local:
        condition: service_healthy
    networks:
      - conx_net

volumes:
  postgres_local_data:
    name: conx_postgres_local_data

networks:
  conx_net:
    name: conx_net
    driver: bridge
